<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Full background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Radar sweep circles -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4"/>

  <!-- Central Shield Badge in safe area -->
  <path d="M256 120 L350 160 C350 255 256 325 256 325 C256 325 162 255 162 160 Z" 
        fill="#0f172a" 
        stroke="url(#shieldGrad)" 
        stroke-width="10" 
        stroke-linejoin="round"/>

  <!-- Cloud -->
  <path d="M220 230 C208 230 197 220 197 208 C197 196 206 187 217 186 C221 172 233 162 249 162 C266 162 281 174 284 190 C292 191 299 197 299 206 C299 216 291 224 281 224 L220 224 Z" 
        fill="#ffffff" 
        opacity="0.95"/>

  <!-- Warning Lightning / Spark -->
  <polygon points="252,215 238,248 258,248 248,285 278,240 258,240" 
           fill="url(#radarGrad)"/>

  <!-- Safe status dot -->
  <circle cx="256" cy="375" r="8" fill="#10b981"/>
</svg>
