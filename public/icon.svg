<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Radar sweep circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Central Shield Badge -->
  <path d="M256 96 L376 148 C376 270 256 360 256 360 C256 360 136 270 136 148 Z" 
        fill="#0f172a" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Weather Cloud & Lightning Symbol inside Shield -->
  <!-- Cloud -->
  <path d="M210 240 C195 240 182 228 182 213 C182 199 193 188 206 186 C211 168 227 155 247 155 C269 155 287 170 291 190 C301 191 309 199 309 210 C309 222 299 232 287 232 L210 232 Z" 
        fill="#ffffff" 
        opacity="0.95"/>

  <!-- Warning Lightning / Spark -->
  <polygon points="252,225 234,265 258,265 246,310 282,255 258,255" 
           fill="url(#radarGrad)" 
           filter="url(#glow)"/>

  <!-- Bottom Indicator Text / Indicator Dot -->
  <circle cx="256" cy="420" r="10" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="420" r="18" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7"/>
</svg>
